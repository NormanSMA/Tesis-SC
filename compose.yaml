name: sc-plataforma

# .env.example da los valores base. .env, si existe, los sobreescribe.
# Las credenciales viven solo en esos archivos.
x-entorno: &entorno
  env_file:
    - path: .env.example
    - path: .env
      required: false

services:
  db:
    <<: *entorno
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    # JIT apagado: con volumen alto añade más de un segundo a la consulta del panel comercial (docs/auditoria/2-3).
    command: ["postgres", "-c", "jit=off"]
    # Límites medidos el 2026-10-12: la base usa unos 60 MiB en reposo. El margen evita que un error la deje sin memoria al equipo.
    mem_limit: 1g
    cpus: 2
    volumes:
      - sc_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5442}:5432"
    healthcheck:
      # -h 127.0.0.1 fuerza TCP. El servidor temporal del arranque solo escucha en socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  migrate:
    <<: *entorno
    build:
      context: .
      target: tools
    image: sc-plataforma-tools
    environment:
      DB_HOST: db
    command: ["sh", "/app/scripts/db/preparar.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *entorno
    build:
      context: .
      target: runner
    image: sc-plataforma-app
    restart: unless-stopped
    # La app usa unos 340 MiB en reposo (medido el 2026-10-12). Se verifica con scripts/rendimiento.mjs bajo carga.
    mem_limit: 1g
    cpus: 2
    environment:
      DB_HOST: db
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/salud').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  db_test:
    <<: *entorno
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    profiles: ["test"]
    environment:
      POSTGRES_DB: sc_test
    # fsync apagado: la base de pruebas es desechable y vive en memoria.
    # 300 conexiones: ci:local corre las 9 secciones a la vez, cada una con pools de dueño y de app.
    command: ["postgres", "-c", "fsync=off", "-c", "jit=off", "-c", "max_connections=300"]
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5443:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d sc_test"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 3s

  # Respaldo programado cada 23 horas, con margen sobre las 24 horas de RNF-06. Arranca con el resto: docker compose up -d
  # Bitacora de intentos: docker compose exec respaldo cat /respaldos/registro.log
  respaldo:
    <<: *entorno
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    healthcheck:
      # Sano si el ultimo intento registrado fue exitoso y ocurrio hace menos de 26 horas.
      test: ["CMD-SHELL", "tail -n 1 /respaldos/registro.log | grep -q ' OK ' && test -n \"$(find /respaldos/registro.log -mmin -1560)\""]
      interval: 10m
      timeout: 10s
      retries: 1
      start_period: 2m
    volumes:
      - sc_respaldos:/respaldos
      - ./scripts/respaldo-programado.sh:/usr/local/bin/respaldo-programado.sh:ro
    entrypoint: ["sh", "/usr/local/bin/respaldo-programado.sh"]
    mem_limit: 256m
    cpus: 1
    depends_on:
      db:
        condition: service_healthy

  # Proxy HTTPS opcional (ADR-017): docker compose --profile proxy up -d proxy
  # Requiere PROXY_CLAVE (32 o más caracteres) en .env: node scripts/generar-proxy-clave.mjs
  proxy:
    <<: *entorno
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    profiles: ["proxy"]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - sc_caddy_data:/data
      - sc_caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  sc_pgdata:
  sc_respaldos:
  sc_caddy_data:
  sc_caddy_config:
