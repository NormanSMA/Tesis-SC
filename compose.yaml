name: sc-plataforma

# .env.example da los valores base. .env, si existe, los sobreescribe.
# Las credenciales viven solo en esos archivos.
x-entorno: &entorno
  env_file:
    - path: .env.example
    - path: .env
      required: false

services:
  db:
    <<: *entorno
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - sc_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5442}:5432"
    healthcheck:
      # -h 127.0.0.1 fuerza TCP. El servidor temporal del arranque solo escucha en socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  migrate:
    <<: *entorno
    build:
      context: .
      target: tools
    image: sc-plataforma-tools
    environment:
      DB_HOST: db
    command: ["sh", "/app/scripts/db/preparar.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *entorno
    build:
      context: .
      target: runner
    image: sc-plataforma-app
    restart: unless-stopped
    environment:
      DB_HOST: db
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/salud').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  db_test:
    <<: *entorno
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: sc_test
    # fsync apagado: la base de pruebas es desechable y vive en memoria.
    command: ["postgres", "-c", "fsync=off"]
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5443:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d sc_test"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 3s

  # Respaldo programado cada 24 horas (RNF-06). Se activa con: docker compose --profile respaldo up -d respaldo
  respaldo:
    <<: *entorno
    image: postgres:17-alpine
    profiles: ["respaldo"]
    restart: unless-stopped
    volumes:
      - sc_respaldos:/respaldos
      - ./scripts/respaldo-programado.sh:/usr/local/bin/respaldo-programado.sh:ro
    entrypoint: ["sh", "/usr/local/bin/respaldo-programado.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  sc_pgdata:
  sc_respaldos:
